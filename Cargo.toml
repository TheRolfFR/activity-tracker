[package]
name = "activity-tracker"
version = "1.0.0"
description = "An iced app to track your worktime"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.57"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# BACKEND
rdev = "0.5.3" # Listen to inputs
## Serialize / deserialize
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
serde_with = "3.22.0"
## logging
log = "0.4.33"
simple-logging = "2.0.2"

# GUI
iced = { version = "0.14.0", features = ["tokio", "sipper", "image", "advanced", "svg"] }
iced_core = "0.14.0"
iced-fluent-theme = { version = "0.1.0", features = ["svg"] }
## Tray icon with menu
tokio = { version = "1.48.0", features = ["time"] }
tray-icon = "0.24.2"
image = "0.25.10"

[[bin]]
name = "activity-tracker-app"
path = "src/main.rs"
